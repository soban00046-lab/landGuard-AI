<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANDGUARD — AI-Powered Land Acquisition Risk Predictor</title>
    <meta name="description" content="AI-Powered Land Acquisition Risk Predictor for proactive risk management and delay forecasting.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <i data-lucide="shield-check" class="logo-icon" style="color: var(--accent-primary); width: 28px; height: 28px; margin-right: 12px;"></i>
                <div>
                    <h1>LANDGUARD</h1>
                    <div class="tagline">RISK PREDICTOR AI</div>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-item active" data-page="dashboard">
                    <i data-lucide="layout-dashboard" class="icon"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" data-page="projects">
                    <i data-lucide="folder-kanban" class="icon"></i>
                    <span>Projects</span>
                    <span class="badge">12</span>
                </div>
                <div class="nav-item" data-page="map">
                    <i data-lucide="map" class="icon"></i>
                    <span>Risk Map</span>
                </div>
                <div class="nav-item" data-page="alerts">
                    <i data-lucide="bell-ring" class="icon"></i>
                    <span>Alerts</span>
                    <span class="badge" style="background: var(--risk-high);">3</span>
                </div>
                <div class="nav-item" data-page="reports">
                    <i data-lucide="file-bar-chart-2" class="icon"></i>
                    <span>Reports</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <i data-lucide="settings" class="icon"></i>
                    <span>Settings</span>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <p>LANDGUARD v1.0</p>
                <p>System Status: <span style="color: var(--risk-low);">Online</span></p>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <!-- Content will be dynamically loaded here by JS -->
        </main>
    </div>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
    <script>
        // Initialize icons for the static shell elements
        lucide.createIcons();
    </script>
</body>
</html>
